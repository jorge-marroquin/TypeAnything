<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Typelit Personalizado</title>
    <style>
        /* --- ESTILOS VISUALES (CSS) --- */
        body { 
            font-family: monospace; 
            font-size: 24px; 
            padding: 40px; 
            background-color: #f4f4f4;
        }

        #pantalla-inicio {
            text-align: center;
        }
        
        textarea {
            width: 100%;
            max-width: 800px;
            padding: 15px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        #texto-mostrar { 
            line-height: 1.6; 
            max-width: 800px; 
            margin: 0 auto;
            color: #666;
            white-space: pre-wrap; 
            text-align: left;
        }
        
        /* Colores de las letras */
        .correcto { 
            color: #a0a0a0; 
        } 
        .incorrecto { 
            color: white;
            background-color: #ff4c4c; 
        }
        .actual { 
            background-color: #d0e8ff; 
            border-bottom: 2px solid blue;
        }

        /* Panel de estadísticas */
        #estadisticas {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
            background-color: #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        /* Estilos generales para botones */
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff; /* Azul */
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        
        button:hover {
            background-color: #0056b3; /* Azul más oscuro al pasar el mouse */
        }

        /* Estilo especial para el botón de reiniciar */
        #boton-reiniciar {
            background-color: #dc3545; /* Rojo */
            font-size: 16px;
            padding: 8px 16px;
        }

        #boton-reiniciar:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <!-- PANTALLA 1: Inicio -->
    <div id="pantalla-inicio">
        <h2>Pega tu texto aquí:</h2>
        <textarea id="texto-entrada" rows="5">Escribe aquí tu propio texto para practicar. ¡Puedes borrar esto y pegar un libro entero!</textarea>
        <br><br>
        <button id="boton-empezar">Comenzar a escribir</button>
    </div>
    
    <!-- PANTALLA 2: Escritura -->
    <div id="pantalla-escritura" style="display: none;">
        <div id="estadisticas">
            <span>Tiempo: <span id="tiempo">0</span>s</span> | 
            <span>Velocidad: <span id="wpm">0</span> WPM</span>
            <!-- Aquí agregamos el nuevo botón -->
            <button id="boton-reiniciar">Reiniciar / Cambiar texto</button>
        </div>
        <div id="texto-mostrar"></div>
    </div>

    <!-- --- CEREBRO DE LA APP (JavaScript) --- -->
    <script>
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const pantallaEscritura = document.getElementById('pantalla-escritura');
        const textoEntrada = document.getElementById('texto-entrada');
        const botonEmpezar = document.getElementById('boton-empezar');
        const botonReiniciar = document.getElementById('boton-reiniciar');
        const textoMostrar = document.getElementById('texto-mostrar');
        const vistaTiempo = document.getElementById('tiempo');
        const vistaWpm = document.getElementById('wpm');

        let letras = [];
        let indiceActual = 0;
        let temporizador;
        let tiempo = 0;
        let escribiendo = false;

        // ACCIÓN: Iniciar el juego
        botonEmpezar.addEventListener('click', () => {
            const texto = textoEntrada.value;
            if (!texto) return;

            pantallaInicio.style.display = 'none';
            pantallaEscritura.style.display = 'block';
            textoMostrar.innerHTML = '';
            indiceActual = 0;
            tiempo = 0;
            escribiendo = false;
            vistaTiempo.textContent = 0;
            vistaWpm.textContent = 0;
            clearInterval(temporizador); 

            texto.split('').forEach(caracter => {
                const span = document.createElement('span');
                span.textContent = caracter;
                textoMostrar.appendChild(span);
            });

            letras = document.querySelectorAll('#texto-mostrar span');
            letras[0].classList.add('actual');
            
            window.removeEventListener('keydown', manejarEscritura);
            window.addEventListener('keydown', manejarEscritura);
        });

        // ACCIÓN: Reiniciar el juego (¡Lo nuevo!)
        botonReiniciar.addEventListener('click', () => {
            clearInterval(temporizador); // Apaga el reloj
            
            // Oculta la escritura y regresa a la pantalla de inicio
            pantallaEscritura.style.display = 'none';
            pantallaInicio.style.display = 'block';
            
            // Apaga el teclado para que no marque errores por error
            window.removeEventListener('keydown', manejarEscritura);
        });

        function iniciarTemporizador() {
            if (!escribiendo) {
                escribiendo = true; 
                temporizador = setInterval(() => {
                    tiempo++;
                    vistaTiempo.textContent = tiempo;
                    
                    let correctos = document.querySelectorAll('.correcto').length;
                    let minutos = tiempo / 60;
                    let wpm = Math.round((correctos / 5) / minutos);
                    
                    if (!wpm || wpm < 0) wpm = 0;
                    vistaWpm.textContent = wpm;
                    
                }, 1000); 
            }
        }

        function manejarEscritura(evento) {
            if (evento.key.length !== 1 && evento.key !== 'Backspace') return;
            if (indiceActual >= letras.length) return; 

            iniciarTemporizador();

            const letraActual = letras[indiceActual];

            if (evento.key === 'Backspace') {
                if (indiceActual > 0) {
                    letraActual.className = ''; 
                    indiceActual--; 
                    letras[indiceActual].className = 'actual'; 
                }
                return;
            }

            if (evento.key === ' ') {
                evento.preventDefault(); // Evita que la pantalla baje
            }

            if (evento.key === letraActual.textContent) {
                letraActual.className = 'correcto';
            } else {
                letraActual.className = 'incorrecto';
            }

            indiceActual++;
            
            if (indiceActual < letras.length) {
                letras[indiceActual].className = 'actual';
            } else {
                clearInterval(temporizador); // Detiene el reloj si terminaste el texto
            }
        }
    </script>
</body>
</html>
