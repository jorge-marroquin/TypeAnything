<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Capitulos - TypeAnything</title>

<link rel="stylesheet" href="css/estilo.css">

    <script>
if(localStorage.getItem("tema") === "oscuro"){
    document.documentElement.classList.add("modo-oscuro");
}
</script>

</head>

<body>

    <button id="boton-tema">🌙 Modo Nocturno</button>
    
<h1 id="titulo-libro"></h1>

<div id="lista-capitulos"></div>


<script src="js/textos/eloquentjavascript.js"></script>
<script src="js/textos/sentireselsecreto.js"></script>
<script src="js/textos/lafeestufortuna.js"></script>
<script src="js/libros.js"></script>

<script>

const parametros =
new URLSearchParams(window.location.search);


const idLibro =
parametros.get("libro");


const libro =
libros.find(l=>l.id===idLibro);


const titulo =
document.getElementById("titulo-libro");


const lista =
document.getElementById("lista-capitulos");


titulo.textContent =
libro.titulo;


libro.capitulos.forEach((cap,index)=>{

    let boton=document.createElement("button");

    boton.textContent=cap.nombre;


    boton.onclick=()=>{

        console.log(cap.texto);

        localStorage.setItem(
            "textoPractica",
            cap.texto
        );

        window.location.href="index.html";

    };


    lista.appendChild(boton);

});




</script>
    <script src="js/tema.js"></script>
