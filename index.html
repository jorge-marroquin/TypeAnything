<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Typelit Personalizado</title>
    <style>
        /* --- ESTILOS VISUALES (CSS) --- */
        body { 
            font-family: monospace; 
            font-size: 24px; 
            padding: 20px; 
            background-color: #f4f4f4;
        }

        #pantalla-inicio {
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #texto-mostrar { 
            line-height: 1.6; 
            max-width: 800px; 
            margin: 0 auto;
            color: #666;
            white-space: pre-wrap; 
            text-align: left;
            min-height: 300px; 
        }
        
        /* Colores de las letras */
        .correcto { color: #a0a0a0; } 
        .incorrecto { 
            color: white;
            background-color: #ff4c4c; 
        }
        .actual { 
            background-color: #d0e8ff; 
            border-bottom: 2px solid blue;
        }

        /* Panel de estadísticas */
        #estadisticas {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
            background-color: #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        /* Botones */
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #0056b3; }
        #boton-reiniciar { background-color: #dc3545; }
        #boton-reiniciar:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <!-- PANTALLA 1: Inicio -->
    <div id="pantalla-inicio">
        <h2>Pega tu texto aquí:</h2>
        <textarea id="texto-entrada" rows="10">Escribe aquí tu propio texto para practicar. Si pegas un texto muy largo, se dividirá automáticamente en varias páginas para que no te pierdas. ¡Inténtalo!</textarea>
        <br><br>
        <button id="boton-empezar">Comenzar a escribir</button>
    </div>
    
    <!-- PANTALLA 2: Escritura -->
    <div id="pantalla-escritura" style="display: none;">
        <div id="estadisticas">
            <span>Tiempo: <span id="tiempo">0</span>s</span> | 
            <span><span id="wpm">0</span> WPM</span> |
            <span>Precisión: <span id="precision">100</span>%</span> |
            <span>Pág: <span id="num-pagina">1</span>/<span id="total-paginas">1</span></span>
            <button id="boton-reiniciar">Cambiar texto</button>
        </div>
        <div id="texto-mostrar"></div>
    </div>

    <!-- --- CEREBRO DE LA APP (JavaScript) --- -->
    <script>
        const pantallaInicio = document.getElementById('pantalla-inicio');
        const pantallaEscritura = document.getElementById('pantalla-escritura');
        const textoEntrada = document.getElementById('texto-entrada');
        const botonEmpezar = document.getElementById('boton-empezar');
        const botonReiniciar = document.getElementById('boton-reiniciar');
        const textoMostrar = document.getElementById('texto-mostrar');
        
        // Vistas de estadísticas
        const vistaTiempo = document.getElementById('tiempo');
        const vistaWpm = document.getElementById('wpm');
        const vistaPrecision = document.getElementById('precision');
        const vistaNumPagina = document.getElementById('num-pagina');
        const vistaTotalPaginas = document.getElementById('total-paginas');

        // Variables de estado
        let paginas = [];
        let paginaActual = 0;
        let letras = [];
        let indiceActual = 0;
        
        let temporizador;
        let tiempo = 0;
        let escribiendo = false;
        let pulsacionesTotales = 0;
        let pulsacionesCorrectas = 0;
        
        const CARACTERES_POR_PAGINA = 500; // Cuánto texto cabe en una pantalla

        // Función para cortar el texto sin romper palabras a la mitad
        function dividirTextoEnPaginas(texto, max) {
            let pags = [];
            let i = 0;
            while (i < texto.length) {
                let fin = i + max;
                if (fin < texto.length) {
                    let ultimoEspacio = texto.lastIndexOf(' ', fin);
                    let ultimoEnter = texto.lastIndexOf('\n', fin);
                    let puntoCorte = Math.max(ultimoEspacio, ultimoEnter);
                    
                    if (puntoCorte > i) {
                        fin = puntoCorte + 1;
                    }
                }
                pags.push(texto.slice(i, fin));
                i = fin;
            }
            return pags;
        }

        // Función para dibujar una página en la pantalla
        function mostrarPagina(indicePagina) {
            textoMostrar.innerHTML = ''; 
            indiceActual = 0;
            
            vistaNumPagina.textContent = indicePagina + 1;
            
            paginas[indicePagina].split('').forEach(caracter => {
                const span = document.createElement('span');
                span.textContent = caracter;
                textoMostrar.appendChild(span);
            });

            letras = document.querySelectorAll('#texto-mostrar span');
            if (letras.length > 0) {
                letras[0].classList.add('actual');
            }
        }

        // ACCIÓN: Iniciar
        botonEmpezar.addEventListener('click', () => {
            const texto = textoEntrada.value.trim();
            if (!texto) return;

            // Reiniciar variables
            tiempo = 0;
            escribiendo = false;
            pulsacionesTotales = 0;
            pulsacionesCorrectas = 0;
            vistaTiempo.textContent = 0;
            vistaWpm.textContent = 0;
            vistaPrecision.textContent = 100;
            clearInterval(temporizador); 

            // Dividir el texto y mostrar la primera página
            paginas = dividirTextoEnPaginas(texto, CARACTERES_POR_PAGINA);
            paginaActual = 0;
            vistaTotalPaginas.textContent = paginas.length;
            
            pantallaInicio.style.display = 'none';
            pantallaEscritura.style.display = 'block';
            
            mostrarPagina(paginaActual);
            
            window.removeEventListener('keydown', manejarEscritura);
            window.addEventListener('keydown', manejarEscritura);
        });

        // ACCIÓN: Reiniciar
        botonReiniciar.addEventListener('click', () => {
            clearInterval(temporizador);
            pantallaEscritura.style.display = 'none';
            pantallaInicio.style.display = 'block';
            window.removeEventListener('keydown', manejarEscritura);
        });

        function iniciarTemporizador() {
            if (!escribiendo) {
                escribiendo = true; 
                temporizador = setInterval(() => {
                    tiempo++;
                    vistaTiempo.textContent = tiempo;
                    
                    let minutos = tiempo / 60;
                    let wpm = Math.round((pulsacionesCorrectas / 5) / minutos);
                    vistaWpm.textContent = wpm > 0 ? wpm : 0;
                    
                }, 1000); 
            }
        }

        function manejarEscritura(evento) {
            if (evento.key.length !== 1 && evento.key !== 'Backspace') return;
            if (indiceActual >= letras.length) return; 

            iniciarTemporizador();
            const letraActual = letras[indiceActual];

            if (evento.key === 'Backspace') {
                if (indiceActual > 0) {
                    letraActual.className = ''; 
                    indiceActual--; 
                    letras[indiceActual].className = 'actual'; 
                }
                return;
            }

            if (evento.key === ' ') {
                evento.preventDefault(); 
            }

            pulsacionesTotales++;
            
            if (evento.key === letraActual.textContent) {
                letraActual.className = 'correcto';
                pulsacionesCorrectas++;
            } else {
                letraActual.className = 'incorrecto';
            }
            
            let porcentaje = Math.round((pulsacionesCorrectas / pulsacionesTotales) * 100);
            vistaPrecision.textContent = porcentaje;

            indiceActual++;
            
            if (indiceActual < letras.length) {
                letras[indiceActual].className = 'actual';
            } else {
                if (paginaActual < paginas.length - 1) {
                    paginaActual++;
                    mostrarPagina(paginaActual); 
                } else {
                    clearInterval(temporizador);
                    letraActual.classList.remove('actual');
                }
            }
        }
    </script>
</body>
</html>
