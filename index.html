<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TypeAnything</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

<button id="boton-tema">
🌙 Modo Nocturno
</button>

<div id="pantalla-inicio">
    <h2>Pega tu texto aquí:</h2>

    <textarea id="texto-entrada"></textarea>

    <button id="boton-empezar">
        Comenzar a escribir
    </button>
</div>


<div id="pantalla-escritura" style="display:none">

    <div id="estadisticas">
        Tiempo:
        <span id="tiempo">0</span>s |

        <span id="wpm">0</span> WPM |

        Precisión:
        <span id="precision">100</span>%

    </div>

    <div id="texto-mostrar"></div>

</div>


<script src="js/libros.js"></script>
<script src="js/ejercicios.js"></script>
<script src="js/app.js"></script>

</body>
</html>
