
<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Mi Typelit Personalizado</title>
<style>
body{font-family:monospace;font-size:24px;padding:20px;background:#f4f4f4;color:#333;transition:.3s;position:relative}
body.modo-oscuro{background:#1e1e1e;color:#ccc}
.modo-oscuro #texto-mostrar{color:#888}
.modo-oscuro .correcto{color:#444}
.modo-oscuro .incorrecto{background:#a02020;color:#fff}
.modo-oscuro .actual{background:#003366;border-bottom:2px solid #4da6ff}
.modo-oscuro textarea,.modo-oscuro #estadisticas{background:#2d2d2d;color:#ccc;border:1px solid #555}
#boton-tema{position:absolute;top:20px;right:20px;background:#333;color:#fff;padding:8px 15px;font-size:14px;border-radius:20px;border:none;cursor:pointer}
.modo-oscuro #boton-tema{background:#f4f4f4;color:#333}
#pantalla-inicio{text-align:center;max-width:800px;margin:0 auto;padding-top:40px}
textarea{width:100%;padding:15px;font-family:sans-serif;font-size:18px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
#texto-mostrar{line-height:1.6;max-width:800px;margin:0 auto;color:#666;white-space:pre-wrap;text-align:left;min-height:300px}
.correcto{color:#a0a0a0}.incorrecto{background:#ff4c4c;color:#fff}.actual{background:#d0e8ff;border-bottom:2px solid blue}
#estadisticas{text-align:center;font-size:18px;font-weight:bold;background:#e0e0e0;padding:15px;border-radius:8px;display:flex;justify-content:center;gap:15px;max-width:800px;margin:40px auto 30px}
button{padding:10px 20px;font-size:16px;cursor:pointer;border:none;border-radius:5px;background:#007bff;color:#fff;font-weight:bold}
button:hover{background:#0056b3}
#boton-reiniciar{background:#dc3545}
#boton-reiniciar:hover{background:#c82333}
</style></head>
<body>
<button id="boton-tema">🌙 Modo Nocturno</button>
<div id="pantalla-inicio">
<h2>Pega tu texto aquí:</h2>
<textarea id="texto-entrada" rows="10">El "secreto" del éxito es la constancia.

A veces, copiamos textos largos (como este) que tienen guiones — y comillas tipográficas como “estas”. Ahora el sistema las reconocerá automáticamente.</textarea><br><br>
<button id="boton-empezar">Comenzar a escribir</button></div>
<div id="pantalla-escritura" style="display:none">
<div id="estadisticas"><span>Tiempo: <span id="tiempo">0</span>s</span> | <span><span id="wpm">0</span> WPM</span> | <span>Precisión: <span id="precision">100</span>%</span> | <span>Pág: <span id="num-pagina">1</span>/<span id="total-paginas">1</span></span><button id="boton-reiniciar">Cambiar texto</button></div>
<div id="texto-mostrar"></div></div>
<script>
const $=id=>document.getElementById(id);
const bt=$('boton-tema'),pi=$('pantalla-inicio'),pe=$('pantalla-escritura'),te=$('texto-entrada'),be=$('boton-empezar'),br=$('boton-reiniciar'),tm=$('texto-mostrar'),vt=$('tiempo'),vw=$('wpm'),vp=$('precision'),vn=$('num-pagina'),vtp=$('total-paginas');
let pags=[],pagAct=0,letras=[],indAct=0,temp,t=0,escribiendo=!1,pulTot=0,pulCor=0;
bt.onclick=()=>{document.body.classList.toggle('modo-oscuro');bt.textContent=document.body.classList.contains('modo-oscuro')?'☀️ Modo Claro':'🌙 Modo Nocturno'};
const norm=tx=>tx.replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,"-").replace(/\u00A0/g," ");
const divTx=(tx,max)=>{let p=[],i=0;while(i<tx.length){let f=i+max;if(f<tx.length){let uEsp=tx.lastIndexOf(' ',f),uEnt=tx.lastIndexOf('\n',f),corte=Math.max(uEsp,uEnt);if(corte>i)f=corte+1;}p.push(tx.slice(i,f));i=f;}return p;};


const span = document.createElement("span");

if (caracter === "\n") {
    span.textContent = "↵";
    span.dataset.valor = "\n";
} else {
    span.textContent = caracter;
    span.dataset.valor = caracter;
}
    
  
                  
                  if(letras.length>0)letras[0].classList.add('actual');};
const startT=()=>{if(!escribiendo){escribiendo=!0;temp=setInterval(()=>{t++;vt.textContent=t;let w=Math.round((pulCor/5)/(t/60));vw.textContent=w>0?w:0;},1000)}};
const handle=e=>{
    if (
    evento.key.length !== 1 &&
    evento.key !== "Backspace" &&
    evento.key !== "Enter"
) {
    return;
}
    if(indAct>=letras.length)return;
    startT();let lAct=letras[indAct];
    if(e.key==='Backspace')
    {if(indAct>0){lAct.className='';indAct--;letras[indAct].className='actual';}return;}
    if(e.key===' ')e.preventDefault();
    pulTot++;
    if(e.key===lAct.textContent){lAct.className='correcto';pulCor++;}else{lAct.className='incorrecto';}
    vp.textContent=Math.round((pulCor/pulTot)*100);
    indAct++;
    if(indAct<letras.length)letras[indAct].className='actual';else
    {if(pagAct<pags.length-1){pagAct++;showPag(pagAct);}else{clearInterval(temp);lAct.classList.remove('actual');}}
};
be.onclick=()=>{let tx=norm(te.value.trim());
                if(!tx)return;t=0;escribiendo=!1;pulTot=0;pulCor=0;vt.textContent=0;vw.textContent=0;vp.textContent=100;clearInterval(temp);pags=divTx(tx,500);pagAct=0;vtp.textContent=pags.length;pi.style.display='none';pe.style.display='block';showPag(pagAct);window.removeEventListener('keydown',handle);window.addEventListener('keydown',handle);};
br.onclick=()=>{clearInterval(temp);pe.style.display='none';pi.style.display='block';window.removeEventListener('keydown',handle);};

const sesion = {
    fecha: new Date().toISOString(),
    tiempo,
    wpm: parseInt(vistaWpm.textContent),
    precision: parseInt(vistaPrecision.textContent),
    paginas: paginas.length
};

const historial =
    JSON.parse(localStorage.getItem("historial")) || [];

historial.push(sesion);

localStorage.setItem(
    "historial",
    JSON.stringify(historial)
);
</script>
</body>
</html>
